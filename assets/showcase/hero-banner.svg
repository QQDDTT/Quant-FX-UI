<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="fxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B12"/>
      <stop offset="50%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#141B26"/>
    </linearGradient>
    <linearGradient id="cbsiBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#3FB950"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>
    <pattern id="fxGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#21262D" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; fill: #F0F6FC; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; }
    .wave-line { stroke-dasharray: 850; stroke-dashoffset: 850; animation: drawFx 4.2s ease-out forwards infinite; }
    .pulse-dot { animation: fxPulse 2s infinite ease-in-out; }
    @keyframes drawFx {
      0% { stroke-dashoffset: 850; }
      68%, 100% { stroke-dashoffset: 0; }
    }
    @keyframes fxPulse {
      0%, 100% { r: 4.5px; opacity: 1; }
      50% { r: 7.5px; opacity: 0.55; }
    }
  </style>

  <!-- Outer Frame & Grid -->
  <rect width="1200" height="420" rx="16" fill="url(#fxBg)" stroke="#30363D" stroke-width="2"/>
  <rect x="20" y="20" width="1160" height="380" rx="12" fill="url(#fxGrid)" opacity="0.65"/>

  <!-- Top Telemetry Bar -->
  <rect x="32" y="28" width="1136" height="54" rx="10" fill="#161B22" stroke="#30363D"/>
  <circle cx="58" cy="55" r="6" fill="#3FB950">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="74" y="60" class="title" font-size="18">QUANT-FX · GLOBAL 48-ASSET INTRADAY 5MIN ALPHA &amp; CBSI ENGINE</text>
  <rect x="636" y="40" width="166" height="30" rx="6" fill="#1F2937" stroke="#58A6FF"/>
  <text x="648" y="59" class="mono" font-size="12" fill="#79C0FF">5,686,052+ CANDLES</text>
  <rect x="814" y="40" width="162" height="30" rx="6" fill="#271E36" stroke="#BC8CFF"/>
  <text x="826" y="59" class="mono" font-size="12" fill="#D2A8FF">8-CCY CBSI MATRIX</text>
  <rect x="988" y="40" width="166" height="30" rx="6" fill="#122D1F" stroke="#3FB950"/>
  <text x="1000" y="59" class="mono" font-size="12" fill="#56D364">SPREAD FILTER &lt;=1.8x</text>

  <!-- Left Panel: G8 CBSI Strength Divergence & 5min->30min Intraday Signal -->
  <rect x="32" y="96" width="750" height="292" rx="12" fill="#0D1117" fill-opacity="0.9" stroke="#30363D"/>
  <text x="52" y="126" class="title" font-size="14" fill="#8B949E">8-CURRENCY ABSOLUTE STRENGTH (CBSI) &amp; 5MIN → 30MIN BIDIRECTIONAL ALPHA</text>
  <text x="615" y="126" class="mono" font-size="12" fill="#F59E0B">● INFER LATENCY: &lt;30ms</text>

  <!-- Reference Grid Lines -->
  <line x1="52" y1="168" x2="760" y2="168" stroke="#21262D" stroke-dasharray="4 4"/>
  <line x1="52" y1="228" x2="760" y2="228" stroke="#30363D"/>
  <line x1="52" y1="288" x2="760" y2="288" stroke="#21262D" stroke-dasharray="4 4"/>
  <text x="56" y="222" class="mono" font-size="10" fill="#6E7681">CBSI ZERO EQUILIBRIUM (28-PAIR G8 DECOUPLED)</text>

  <!-- USD / Gold / JPY Strength Waves -->
  <path d="M 65 265 C 145 245, 225 205, 315 190 C 405 175, 490 215, 585 162 C 650 135, 705 128, 748 118" fill="none" stroke="url(#cbsiBlue)" stroke-width="3.5" class="wave-line"/>
  <path d="M 65 240 C 150 255, 235 230, 320 198 C 415 165, 505 152, 595 140 C 660 132, 710 120, 748 108" fill="none" stroke="url(#goldLine)" stroke-width="3" class="wave-line"/>
  <path d="M 65 195 C 145 215, 230 250, 325 268 C 420 285, 510 272, 605 302 C 665 318, 715 326, 748 332" fill="none" stroke="#F85149" stroke-width="2.5" stroke-dasharray="6 4"/>

  <circle cx="585" cy="162" r="5" fill="#3FB950" class="pulse-dot"/>
  <circle cx="748" cy="108" r="5" fill="#FDE047" class="pulse-dot"/>
  <circle cx="748" cy="332" r="5" fill="#F85149" class="pulse-dot"/>

  <!-- Signal Callout Boxes -->
  <rect x="70" y="138" width="190" height="48" rx="8" fill="#161B22" stroke="#58A6FF"/>
  <text x="82" y="157" class="mono" font-size="11" fill="#79C0FF">LONG: XAU/USD · EUR/JPY</text>
  <text x="82" y="175" class="mono" font-size="11" fill="#3FB950">5-Fold IC: +0.0783 (ICIR 8.26)</text>

  <rect x="535" y="255" width="210" height="50" rx="8" fill="#161B22" stroke="#BC8CFF"/>
  <text x="547" y="274" class="mono" font-size="11" fill="#D2A8FF">EM &amp; CARRY CLUSTER</text>
  <text x="547" y="293" class="mono" font-size="11" fill="#56D364">Mean Rank IC: +0.1053 (ICIR 10.38)</text>

  <text x="54" y="368" class="mono" font-size="11" fill="#8B949E">144/144 PARTITIONS 100% COMPLIANT (1DAY / 1H / 5MIN) · OANDA v20 PRACTICE SANDBOX</text>

  <!-- Right Panel: Spread Circuit Breaker & Kill-Switch Cockpit -->
  <rect x="798" y="96" width="370" height="292" rx="12" fill="#0D1117" fill-opacity="0.9" stroke="#30363D"/>
  <text x="818" y="126" class="title" font-size="14" fill="#8B949E">PRE-TRADE SPREAD &amp; RISK COCKPIT</text>

  <!-- 4 Tiered Gauge Cards -->
  <rect x="818" y="142" width="160" height="72" rx="8" fill="#161B22" stroke="#3FB950"/>
  <text x="830" y="164" class="mono" font-size="11" fill="#8B949E">SPREAD GATE (&lt;=1.8x)</text>
  <text x="830" y="188" class="mono" font-size="16" font-weight="700" fill="#3FB950">84.52% BLOCKED</text>
  <text x="830" y="204" class="mono" font-size="10" fill="#6E7681">Rejects wide-spread noise</text>

  <rect x="990" y="142" width="158" height="72" rx="8" fill="#161B22" stroke="#58A6FF"/>
  <text x="1002" y="164" class="mono" font-size="11" fill="#8B949E">5MIN DIRECTION ACC</text>
  <text x="1002" y="188" class="mono" font-size="16" font-weight="700" fill="#79C0FF">57.50% OOS</text>
  <text x="1002" y="204" class="mono" font-size="10" fill="#6E7681">339 Trees In-Memory</text>

  <rect x="818" y="226" width="160" height="72" rx="8" fill="#161B22" stroke="#F59E0B"/>
  <text x="830" y="248" class="mono" font-size="11" fill="#8B949E">INTRADAY FLAT TIME</text>
  <text x="830" y="272" class="mono" font-size="16" font-weight="700" fill="#FBBF24">16:45 ET AUTO</text>
  <text x="830" y="288" class="mono" font-size="10" fill="#6E7681">Zero rollover exposure</text>

  <rect x="990" y="226" width="158" height="72" rx="8" fill="#161B22" stroke="#BC8CFF"/>
  <text x="1002" y="248" class="mono" font-size="11" fill="#8B949E">DAILY KILL-SWITCH</text>
  <text x="1002" y="272" class="mono" font-size="16" font-weight="700" fill="#D2A8FF">-1.0% / -1.5%</text>
  <text x="1002" y="288" class="mono" font-size="10" fill="#6E7681">17:05 ET Retrain Loop</text>

  <!-- Disclaimer Banner -->
  <rect x="818" y="312" width="330" height="58" rx="8" fill="#1C1417" stroke="#F85149" stroke-opacity="0.65"/>
  <text x="830" y="334" class="mono" font-size="10.5" font-weight="700" fill="#FF7B72">⚠️ NOT FINANCIAL / FOREX TRADING ADVICE</text>
  <text x="830" y="353" class="mono" font-size="10" fill="#8B949E">OANDA Practice Sandbox Only · Zero Secret Keys</text>
</svg>
